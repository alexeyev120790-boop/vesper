<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="catHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonPinkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="230" fill="url(#cyberGlow)" />

  <!-- Cyber Cat Ears -->
  <polygon points="140,240 100,100 210,180" fill="url(#catHead)" stroke="#ec4899" stroke-width="4" filter="url(#neonBlur)" />
  <polygon points="125,220 115,130 185,185" fill="#f43f5e" opacity="0.8" />

  <polygon points="372,240 412,100 302,180" fill="url(#catHead)" stroke="#06b6d4" stroke-width="4" filter="url(#neonBlur)" />
  <polygon points="387,220 397,130 327,185" fill="#06b6d4" opacity="0.8" />

  <!-- Cat Head Outline -->
  <path d="M 140 220 C 120 300, 160 390, 256 390 C 352 390, 392 300, 372 220 C 340 235, 290 220, 256 220 C 222 220, 172 235, 140 220 Z" fill="url(#catHead)" stroke="url(#neonPinkCyan)" stroke-width="4" filter="url(#neonBlur)" />

  <!-- Cyber Visor / Glowing Glasses -->
  <path d="M 155 240 Q 256 260 357 240 Q 365 295 256 300 Q 147 295 155 240 Z" fill="url(#neonPinkCyan)" filter="url(#neonBlur)" />
  <ellipse cx="205" cy="265" rx="22" ry="12" fill="#ffffff" opacity="0.9" />
  <ellipse cx="307" cy="265" rx="22" ry="12" fill="#ffffff" opacity="0.9" />

  <!-- Neon Whiskers -->
  <line x1="110" y1="310" x2="180" y2="320" stroke="#f472b6" stroke-width="3" stroke-linecap="round" filter="url(#neonBlur)" />
  <line x1="100" y1="335" x2="175" y2="335" stroke="#f472b6" stroke-width="3" stroke-linecap="round" filter="url(#neonBlur)" />
  <line x1="402" y1="310" x2="332" y2="320" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#neonBlur)" />
  <line x1="412" y1="335" x2="337" y2="335" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#neonBlur)" />

  <!-- Cute Nose & Mouth -->
  <polygon points="256,315 248,308 264,308" fill="#f43f5e" />
  <path d="M 248 322 Q 256 332 264 322" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
</svg>
